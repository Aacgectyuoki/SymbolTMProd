<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var l = window.location;
        var repoPath = '/';
        var redirect = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoPath + '?' + 'p=' + encodeURIComponent(l.pathname + l.search + l.hash);
        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
  </html>
